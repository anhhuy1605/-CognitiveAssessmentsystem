version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXT_PUBLIC_API_URL=http://backend:5001
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - recordings_data:/app/recordings
    networks:
      - cognitive-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - STORAGE_PATH=/app/recordings
      - FLASK_ENV=production
      - PORT=8000
    volumes:
      - recordings_data:/app/recordings
    networks:
      - cognitive-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  recordings_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./recordings

networks:
  cognitive-network:
    driver: bridge