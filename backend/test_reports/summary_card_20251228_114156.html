
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #ecf0f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            width: 400px;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .header {
            text-align: center;
            border-bottom: 3px solid #f39c12;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .mmse-score {
            font-size: 72px;
            font-weight: bold;
            color: #f39c12;
            margin: 20px 0;
        }
        .risk-level {
            font-size: 24px;
            color: #f39c12;
            margin: 10px 0;
        }
        .factors {
            margin: 20px 0;
        }
        .factor {
            padding: 10px;
            margin: 10px 0;
            border-left: 4px solid #3498db;
            background: #f8f9fa;
        }
        .factor.positive {
            border-left-color: #2ecc71;
        }
        .factor.negative {
            border-left-color: #e74c3c;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="mmse-score">22/30</div>
            <div class="risk-level">⚠ MCI Risk</div>
        </div>
        
        <div class="factors">

        </div>
        
        <div class="footer">
            <p>Generated on 2025-12-28</p>
            <p>Cognitive Assessment System</p>
        </div>
    </div>
</body>
</html>
